<!-- ===== Electric Logo Intro (paste right after <body>) ===== -->
<style>
  :root{
    --intro-bg: #0b286a;          /* כחול של המותג */
    --intro-glow: rgba(255, 215, 0, .85); /* זוהר צהוב */
    --intro-white: rgba(255,255,255,.92);
  }

  /* שכבת פתיחה */
  .electric-intro{
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: radial-gradient(1200px 700px at 50% 45%, rgba(255,255,255,.08), transparent 55%),
                radial-gradient(900px 500px at 50% 70%, rgba(255,215,0,.10), transparent 60%),
                var(--intro-bg);
    overflow: hidden;
    opacity: 1;
    pointer-events: auto;
    transition: opacity .55s ease;
  }
  .electric-intro.is-hidden{
    opacity: 0;
    pointer-events: none;
  }

  .electric-intro__wrap{
    position: relative;
    width: min(420px, 78vw);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    filter: drop-shadow(0 18px 45px rgba(0,0,0,.35));
  }

  /* הלוגו */
  .electric-intro__logo{
    width: 100%;
    height: 100%;
    border-radius: 999px;
    object-fit: cover;
    transform: scale(.92);
    animation: intro-pop 900ms cubic-bezier(.2,.9,.2,1) 120ms forwards;
    box-shadow: 0 0 0 0 rgba(255,215,0,.0);
  }

  /* הילה סביב הלוגו */
  .electric-intro__wrap::before{
    content:"";
    position:absolute;
    inset:-10%;
    border-radius: 999px;
    background: radial-gradient(circle at 50% 50%, rgba(255,215,0,.22), transparent 60%);
    filter: blur(10px);
    opacity: 0;
    animation: halo-on 1200ms ease 250ms forwards;
  }

  /* “הבזק” */
  .electric-intro__wrap::after{
    content:"";
    position:absolute;
    inset:-18%;
    border-radius: 999px;
    background: conic-gradient(from 90deg,
      transparent 0 12%,
      rgba(255,255,255,.75) 12% 16%,
      transparent 16% 30%,
      rgba(255,215,0,.55) 30% 34%,
      transparent 34% 100%);
    filter: blur(1px);
    opacity: 0;
    animation: flash-sweep 1450ms ease 420ms forwards;
    mix-blend-mode: screen;
  }

  /* שכבת ברקים SVG */
  .electric-intro__svg{
    position:absolute;
    inset:-10%;
    width:120%;
    height:120%;
    overflow: visible;
  }
  .bolt{
    fill: none;
    stroke: var(--intro-white);
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 10px var(--intro-glow));
    opacity: .0;
    stroke-dasharray: 280;
    stroke-dashoffset: 280;
    animation: bolt-draw 900ms ease forwards;
  }
  .bolt.b2{
    stroke: rgba(255,215,0,.95);
    stroke-width: 2.6;
    animation-delay: 220ms;
  }
  .bolt.b3{
    stroke: rgba(255,255,255,.85);
    stroke-width: 2.2;
    animation-delay: 380ms;
  }

  /* ניצוצות קטנים */
  .spark{
    position:absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,215,0,.95);
    filter: blur(.2px) drop-shadow(0 0 12px var(--intro-glow));
    opacity: 0;
    animation: spark-pop 900ms ease forwards;
  }
  .s1{ top: 16%; left: 18%; animation-delay: 260ms; }
  .s2{ top: 22%; right: 16%; animation-delay: 330ms; }
  .s3{ bottom: 18%; left: 22%; animation-delay: 410ms; }
  .s4{ bottom: 22%; right: 20%; animation-delay: 520ms; }

  /* כפתור דילוג */
  .intro-skip{
    position: fixed;
    z-index: 10000;
    bottom: 18px;
    left: 18px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.25);
    color: white;
    padding: 10px 14px;
    border-radius: 999px;
    font: 600 14px/1 system-ui, -apple-system, Segoe UI, Arial;
    backdrop-filter: blur(6px);
    cursor: pointer;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .intro-skip:hover{ transform: translateY(-1px); background: rgba(0,0,0,.35); border-color: rgba(255,255,255,.4); }
  .intro-skip:active{ transform: translateY(0px) scale(.98); }
  .intro-skip:focus{ outline: 3px solid rgba(255,215,0,.55); outline-offset: 2px; }

  /* אנימציות */
  @keyframes intro-pop{
    0%{ transform: scale(.86); }
    55%{ transform: scale(1.02); }
    100%{ transform: scale(.96); }
  }
  @keyframes halo-on{
    0%{ opacity: 0; transform: scale(.92); }
    100%{ opacity: 1; transform: scale(1); }
  }
  @keyframes flash-sweep{
    0%{ opacity: 0; transform: rotate(0deg) scale(.92); }
    30%{ opacity: .9; }
    60%{ opacity: .35; }
    100%{ opacity: 0; transform: rotate(180deg) scale(1.03); }
  }
  @keyframes bolt-draw{
    0%{ opacity: 0; stroke-dashoffset: 280; }
    20%{ opacity: 1; }
    100%{ opacity: 0; stroke-dashoffset: 0; }
  }
  @keyframes spark-pop{
    0%{ opacity: 0; transform: scale(.2); }
    30%{ opacity: 1; transform: scale(1.2); }
    100%{ opacity: 0; transform: scale(.7); }
  }

  /* אם המשתמש לא רוצה תנועה */
  @media (prefers-reduced-motion: reduce){
    .electric-intro__logo,
    .electric-intro__wrap::before,
    .electric-intro__wrap::after,
    .bolt,
    .spark{
      animation: none !important;
    }
  }
</style>

<div class="electric-intro" id="electricIntro" aria-label="פתיח אנימציה">
  <div class="electric-intro__wrap" aria-hidden="true">
    <img class="electric-intro__logo" id="introLogo" alt="לוגו נועם עבודות חשמל" />

    <!-- ברקים מצוירים סביב הלוגו -->
    <svg class="electric-intro__svg" viewBox="0 0 100 100" aria-hidden="true">
      <!-- ברק 1 -->
      <path class="bolt b1" d="M18 42 L30 34 L34 44 L46 36 L40 52 L54 46 L48 64" />
      <!-- ברק 2 -->
      <path class="bolt b2" d="M76 34 L66 44 L74 48 L62 58 L70 62 L58 72" />
      <!-- ברק 3 -->
      <path class="bolt b3" d="M26 74 L36 62 L34 76 L48 66 L44 82" />
    </svg>

    <span class="spark s1"></span>
    <span class="spark s2"></span>
    <span class="spark s3"></span>
    <span class="spark s4"></span>
  </div>

  <button class="intro-skip" id="introSkip" type="button">דלג</button>
</div>

<script>
  // ==== CONFIG ====
  // שים פה את הנתיב ללוגו אצלך באתר (למשל: "img/logo.png")
  const LOGO_SRC = "img/noam-logo.png";

  // כמה זמן להשאיר את הפתיח (מילישניות)
  const INTRO_DURATION = 2400;

  (function initElectricIntro(){
    const intro = document.getElementById("electricIntro");
    const skipBtn = document.getElementById("introSkip");
    const logo = document.getElementById("introLogo");

    // טען לוגו
    logo.src = LOGO_SRC;

    // עוזר: סגירה חלקה
    const closeIntro = () => {
      if (!intro || intro.classList.contains("is-hidden")) return;
      intro.classList.add("is-hidden");
      // להסיר לגמרי מה־DOM אחרי ה־fade
      setTimeout(() => intro.remove(), 650);
    };

    // סגירה אוטומטית
    const prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (prefersReduced) {
      // אם אין תנועה – לסגור מהר
      setTimeout(closeIntro, 250);
    } else {
      setTimeout(closeIntro, INTRO_DURATION);
    }

    // דילוג ידני
    skipBtn?.addEventListener("click", closeIntro);

    // גם קליק על הרקע
    intro?.addEventListener("click", (e) => {
      if (e.target === intro) closeIntro();
    });

    // ESC לדילוג
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeIntro();
    });
  })();
</script>
<!-- ===== /Electric Logo Intro ===== -->
